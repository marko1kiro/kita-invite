name: CI

on:
  push:
    branches:
      - feat/phase1-dev-staging-foundation
      - fix/phase1-dev-staging-foundation-repairs
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck, tests, build, dev API smoke, Worker dry-runs, and local backup/R2 smokes
        run: npm run ci

      - name: Audit locked dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
